name: comportamento

# Testes de comportamento rodam sessões reais do Claude e custam (~US$ 3 a rodada).
# Por isso só rodam à mão: Actions > comportamento > Run workflow.
# Requer o segredo ANTHROPIC_API_KEY no repositório.

on:
  workflow_dispatch:
    inputs:
      cenarios:
        description: "Cenários separados por espaço (vazio = todos)"
        required: false
        default: ""
      modelo:
        description: "Modelo"
        required: false
        default: "opus"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22  # o @anthropic-ai/claude-code atual pede node >= 22
      - name: Instala a CLI do Claude Code e confere que é ela que roda
        # A imagem do runner pode trazer outro claude no PATH (a 0.4.5 testou sem querer a 2.1.197 na instalação).
        run: |
          npm install -g @anthropic-ai/claude-code
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          export PATH="$(npm prefix -g)/bin:$PATH"
          which -a claude || true
          instalada="$(node -p "require('$(npm root -g)/@anthropic-ai/claude-code/package.json').version")"
          rodando="$(claude --version | cut -d' ' -f1)"
          echo "npm instalou $instalada; o claude do PATH é $rodando"
          [ "$instalada" = "$rodando" ] || { echo "::error::o claude do PATH ($rodando) não é o que o npm instalou ($instalada)"; exit 1; }
      - name: Rodar cenários
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MODEL: ${{ inputs.modelo }}
          EVAL_OUT: evals-out
          # A entrada vai por variável, nunca colada no script: texto digitado no formulário não vira comando.
          CENARIOS: ${{ inputs.cenarios }}
        run: |
          git config --global user.email "eval@example.com"
          git config --global user.name "eval"
          # shellcheck disable=SC2086  # separar os nomes por espaço é o esperado
          python3 tests/evals/run.py $CENARIOS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcripts
          path: evals-out
