name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    name: hooks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Versão do bash
        run: bash --version | head -1
      - name: Testes dos hooks e da estrutura
        run: bash tests/hooks/test-hooks.sh
      - name: Hooks também no bash do sistema (3.2 no macOS)
        if: runner.os == 'macOS'
        run: /bin/bash tests/hooks/test-hooks.sh
      - name: NORTE.md de exemplo é válido
        run: scripts/validate-norte tests/evals/fixtures/estudai/NORTE.md

  lint:
    name: lint e checagens baratas (bash -n, py_compile, JSON, shellcheck, versão, resultados)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versão do bash e shellcheck presente (falha se faltar)
        run: bash --version | head -1 && shellcheck --version | sed -n 2p
      - name: scripts/check-all
        # Neste job só o "claude plugin validate" é pulado (não há CLI aqui; ele tem job próprio abaixo).
        run: scripts/check-all

  install:
    name: instalação real pelo marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install -g @anthropic-ai/claude-code
      - name: Instala numa configuração temporária e roda os hooks da cópia instalada
        run: scripts/test-install

  plugin:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
